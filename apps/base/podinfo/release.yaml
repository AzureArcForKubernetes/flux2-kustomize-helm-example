apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: cluster-config
spec:
  targetNamespace: podinfo
  releaseName: podinfo
  chart:
    spec:
      chart: podinfo
      version: "6.17.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: cluster-config
  interval: 5m
  install:
    remediation:
      retries: 3
  # Default values
  # https://github.com/stefanprodan/podinfo/blob/master/charts/podinfo/values.yaml
  values:
    image:
      repository: azurearcfork8sdev.azurecr.io/test-dependencies/stefanprodan/podinfo
      tag: "6.17.0"
    cache: tcp://redis-master.redis:6379
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
